# PRD-299: EXAMPLE Cloudflare Worker config for the Cuttingboard clock.
# Copy to wrangler.toml and deploy out-of-band (owner-held; CF-D5). NO SECRET
# VALUES here or in any committed file.
name = "cuttingboard-clock"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Cloudflare cron triggers are UTC (no timezone support). PRD-319: four
# expressions cover the full weekday cadence in BOTH DST offsets; the
# in-Worker resolveSlot() lookup (event.scheduledTime -> America/Los_Angeles
# wall clock) picks the intended slot and no-ops every off-season twin.
#   50 12       -> PRE cache warm (UTC-anchored, year-round)
#   0 13-21     -> 06:00 PT pipeline OPEN + hourly 07:00..13:00 PT (per season)
#   30 13,14    -> 06:30 PT (one of the pair per season)
#   45 13,14    -> 06:45 PT (one of the pair per season)
#   30 23 SUN   -> Sunday session (23:30 UTC, year-round; existing mode=sunday)
# Completion PR (2026-09-09): the weekday field is the EXPLICIT name range
# MON-FRI (Cloudflare's documented weekday form), never numeric 1-5; every
# weekday TIME is unchanged from PRD-319. The Sunday session row transfers the
# former GitHub `30 23 * * 0` execution cron to this clock (owner ruling).
# This Worker is the AUTHORITATIVE routine clock. The GitHub schedule is a
# liveness PROBE only (hourly_alert.yml `liveness` job) -- it never executes
# product work and does not cover a rejected/missing dispatch.
[triggers]
crons = ["50 12 * * MON-FRI", "0 13-21 * * MON-FRI", "30 13,14 * * MON-FRI", "45 13,14 * * MON-FRI", "30 23 * * SUN"]

# Persisted Workers Logs (smallest supported configuration): the handler's
# ACCEPTED / REJECTED / ERROR lines survive the invocation so a dispatch
# failure is observable after the fact. Transport metadata only -- the handler
# never logs the credential, request headers, or response bodies.
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/
[observability]
enabled = true
head_sampling_rate = 1

# The Actions-write-only GitHub token is a SECRET, set out-of-band, never here:
#   wrangler secret put GH_DISPATCH_TOKEN
# Fine-grained PAT scope: repository dwats250/cuttingboard, Actions: Read and
# write (write is required to POST a workflow_dispatch); NO other permission.
