<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cuttingboard Visual System Lab V0 — Zoned Cockpit variant">
  <title>Cuttingboard Lab · Variant B</title>
  <link rel="stylesheet" href="../shared/base.css">
  <style>
    body[data-variant="b"] {
      --board-max: 1200px;
      --board-pad: 26px;
    }

    .b-zones {
      display: grid;
      gap: 15px;
    }

    .b-zones .zone {
      padding: 15px 17px 17px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: rgba(13, 20, 27, 0.82);
      box-shadow: var(--shadow);
    }

    .b-zones .zone--state {
      background:
        linear-gradient(125deg, rgba(20, 40, 49, 0.34), transparent 42%),
        rgba(17, 24, 32, 0.92);
    }

    .b-zones .zone--opportunity {
      border-color: rgba(131, 184, 201, 0.42);
      background:
        linear-gradient(125deg, rgba(20, 40, 49, 0.44), transparent 46%),
        rgba(15, 22, 29, 0.9);
    }

    .b-zones .zone--context,
    .b-zones .zone--structure,
    .b-zones .zone--history {
      border-color: var(--line);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.12);
    }

    .b-zones .zone-title {
      margin-bottom: 14px;
    }

    .zone-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
    }

    .zone-grid > .surface {
      min-width: 0;
      padding: 13px 0;
      border-top: 1px solid var(--line);
    }

    .zone-grid > .surface:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .zone-grid > .surface:last-child {
      padding-bottom: 0;
    }

    .zone--state > .surface--event-detail {
      margin-top: 14px;
      padding: 13px 0 0 14px;
      border-top: 1px solid var(--line);
    }

    .zone--opportunity .surface--candidate {
      min-height: 100%;
    }

    .zone--context .surface-title,
    .zone--structure .surface-title,
    .zone--history .surface-title {
      color: var(--ink-soft);
    }

    .zone--context .surface-title__note,
    .zone--structure .surface-title__note,
    .zone--history .surface-title__note {
      color: var(--muted);
    }

    @media (min-width: 960px) {
      .zone-grid--state {
        grid-template-columns: minmax(0, 1.22fr) minmax(19rem, 0.78fr);
      }

      .zone-grid--opportunity {
        grid-template-columns: minmax(17rem, 0.68fr) minmax(0, 1.32fr);
      }

      .zone-grid--context {
        grid-template-columns: minmax(18rem, 0.82fr) minmax(0, 1.18fr);
      }

      .zone-grid--structure,
      .zone-grid--history {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .zone-grid--state > .surface,
      .zone-grid--opportunity > .surface,
      .zone-grid--context > .surface,
      .zone-grid--structure > .surface,
      .zone-grid--history > .surface {
        padding: 0 17px;
        border-top: 0;
        border-left: 1px solid var(--line);
      }

      .zone-grid--state > .surface:first-child,
      .zone-grid--opportunity > .surface:first-child,
      .zone-grid--context > .surface:first-child,
      .zone-grid--structure > .surface:first-child,
      .zone-grid--history > .surface:first-child {
        padding-left: 0;
        border-left: 0;
      }

      .zone-grid--state > .surface:last-child,
      .zone-grid--opportunity > .surface:last-child {
        padding-right: 0;
      }

      .zone-grid--context > .surface--macro,
      .zone-grid--structure > .surface--trend,
      .zone-grid--history > .surface--diagnostics {
        grid-column: 1 / -1;
        margin-top: 17px;
        padding: 17px 0 0;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .zone-grid--structure > .surface--trend:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .zone-grid--history > .surface--diagnostics {
        padding-right: 0;
      }
    }

    @media (max-width: 700px) {
      body[data-variant="b"] {
        --board-pad: 14px 10px 28px;
      }

      .b-zones {
        gap: 10px;
      }

      .b-zones .zone {
        padding: 12px 12px 13px;
        border-radius: 10px;
        box-shadow: none;
      }

      .b-zones .zone-title {
        margin-bottom: 10px;
      }

      .zone-grid > .surface {
        padding-block: 10px;
      }

      .zone-grid > .surface .surface-title {
        margin-bottom: 8px;
      }

      .zone--state > .surface--event-detail {
        margin-top: 10px;
        padding-top: 10px;
      }

      .zone--context,
      .zone--structure,
      .zone--history {
        background: rgba(13, 20, 27, 0.62);
      }
    }
  </style>
  <script defer src="../shared/fixture-data.js"></script>
  <script defer src="../shared/prototype.js"></script>
</head>
<body data-variant="b">
  <aside class="lab-toolbar" aria-label="Prototype controls">
    <div class="lab-toolbar__title">
      <strong>CUTTINGBOARD VISUAL SYSTEM LAB V0</strong>
      <span>Throwaway static prototype · no production behavior</span>
    </div>
    <div class="lab-toolbar__controls">
      <nav class="lab-toolbar__nav" aria-label="Variants">
        <a href="../variant-a/index.html" data-variant-link>A</a>
        <a href="../variant-b/index.html" data-variant-link aria-current="page">B</a>
        <a href="../variant-c/index.html" data-variant-link>C</a>
      </nav>
      <label>
        <span hidden>Fixture</span>
        <select class="fixture-select" data-fixture-select aria-label="Fixture mode">
          <option value="normal">NORMAL LONG-CONTENT</option>
          <option value="halt">HALT</option>
          <option value="degraded">DEGRADED / CARRIER UNAVAILABLE</option>
          <option value="event">RED-FOLDER EVENT PRESENT</option>
          <option value="no-candidate">NO CANDIDATE</option>
        </select>
      </label>
    </div>
  </aside>
  <main data-board-root aria-live="polite"></main>
</body>
</html>
