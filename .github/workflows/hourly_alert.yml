name: Cuttingboard Hourly Alert

on:
  schedule:
    # PRD-319 R4: DELAYED FALLBACK HEARTBEATS behind the Cloudflare primary
    # clock (workers/cuttingboard-clock). 06:xx crons carry EXPLICIT intended
    # slot identity (mapped from github.event.schedule below) so a late start
    # never shifts slots; off-season twins no-op in explicit_pt_slot. Hourly
    # heartbeats keep inference (unambiguous on the hour with (6,0) retired).
    # 06:00 PT has NO hourly cron — the daily pipeline owns it.
    - cron: '40 13 * * 1-5'   # 06:40 PDT -> intended 06:30 (PST 05:40 -> no-op)
    - cron: '40 14 * * 1-5'   # 06:40 PST -> intended 06:30 (PDT 07:40 -> no-op)
    - cron: '55 13 * * 1-5'   # 06:55 PDT -> intended 06:45 (PST 05:55 -> no-op)
    - cron: '55 14 * * 1-5'   # 06:55 PST -> intended 06:45 (PDT 07:55 -> no-op)
    - cron: '10 14-21 * * 1-5' # hourly heartbeats, 07:10-13:10 PT per season
  workflow_dispatch:
    inputs:
      # PRD-319 R2: kind=routine + slot lets the Cloudflare clock dispatch a
      # ROUTINE arrival that obeys the PT window and slot dedup exactly like a
      # cron arrival, with explicit slot identity. The default (forced)
      # preserves today's manual-dispatch behavior byte-for-byte.
      kind:
        description: 'routine (CF clock; window+dedup enforced) or forced (manual override)'
        required: false
        default: 'forced'
        type: choice
        options:
          - forced
          - routine
      slot:
        description: 'Intended PT slot HH:MM (routine only; e.g. 06:45)'
        required: false
        default: ''
        type: string
      # CF-E1: the Cloudflare clock (workers/cuttingboard-clock) posts
      # {kind, slot, source}; GitHub rejects undeclared inputs with 422, so
      # `source` must be admitted here. Declared for schema compatibility only.
      source:
        description: 'Dispatch source'
        required: false
        default: ''
        type: string

# Per-workflow self-serialization: the heartbeat and routine-dispatch arrivals
# for one slot must not run concurrently or both could alert before either
# persists last_hourly_slot (dedup needs the prior run's saved slot). PRD-194: cross-workflow publish races go
# through ci_push_artifacts.sh's delta-append + push-retry, not a shared lock that
# would over-serialize this alert behind the pipeline/macro producer (Codex P2).
concurrency:
  group: hourly-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest

    env:
      # PRD-194: artifacts publish to this unprotected branch, not main.
      PUBLISH_BRANCH: publish
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # PRD-304: relay the operator-availability repository variable into the
      # hourly runtime. Absence resolves CANNOT_MONITOR (fail-closed).
      CB_OPERATOR_AVAILABILITY: ${{ vars.CB_OPERATOR_AVAILABILITY }}

    steps:
      # PRD-194: pin to main. workflow_dispatch can be triggered from any branch;
      # publishing now targets the UNPROTECTED `publish` branch, so an unpinned
      # checkout would let a dispatch on a feature branch publish that branch's
      # rendered ui/logs to production. Scheduled runs already run on main.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      # PRD-194 R3: restore the read-back state the alert run reads at startup from
      # the publish branch (main's copies are frozen post-decoupling). Two kinds:
      #  OWNED (hourly regenerates + republishes):
      #   - logs/audit.jsonl: accumulating scoreboard source (delta-appended).
      #   - logs/last_hourly_slot.json: alert dedup slot (Codex P1) — without it a
      #     same-slot twin arrival reads main's frozen slot and re-sends the alert.
      #   - logs/latest_hourly_market_map.json: hourly's isolated lifecycle baseline
      #     (_load_previous_market_map at _execute_notify_run) — frozen => bogus
      #     hourly NEW/REMOVED transitions (Codex P2).
      #  READ-ONLY (pipeline OWNS+publishes; hourly only reads to render, then reverts
      #  to HEAD before commit so it never republishes a copy it doesn't own):
      #   - logs/latest_run.json: renderer's LIVE STATE (pipeline_run), not --run-
      #     overridable — frozen => stale LIVE STATE on the hourly dashboard (Codex P2).
      #   - logs/macro_drivers_snapshot.json: renderer's macro-driver fallback.
      #   - 'logs/run_*.json': pipeline-owned per-run archive the renderer globs for
      #     "Changes Since Last Run" + history. Immutable per file, so restoring +
      #     republishing is idempotent and never clobbers the pipeline's newer runs;
      #     no revert needed. Quoted so the glob reaches the restore helper.
      #   - logs/regime_history.jsonl: the published scoreboard (PRD-204). RESTORED so
      #     the Aggregate step (which runs BEFORE the render) can PRESERVE an already-
      #     published spy_close_change_pct it cannot recompute this run (SPY parquet
      #     absent) instead of wiping it to null; without the restore, preserve-prior
      #     reads only main's frozen 3-row fallback and the wipe still happens.
      # The restore step also records CB_PUBLISH_BASE_SHA for the audit delta-append.
      - name: Restore publish state
        run: bash tools/ci_restore_publish_state.sh logs/audit.jsonl logs/last_hourly_slot.json logs/latest_hourly_market_map.json logs/latest_run.json logs/macro_drivers_snapshot.json logs/regime_history.jsonl 'logs/run_*.json'

      - name: Check Telegram config presence
        run: |
          echo "TELEGRAM_BOT_TOKEN_PRESENT=${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "TELEGRAM_CHAT_ID_PRESENT=${{ secrets.TELEGRAM_CHAT_ID != '' }}"

      # PRD-319 R6: warm the OHLCV cache the pipeline's 12:50Z prefetch run
      # saves (same path/key scheme as cuttingboard.yml). RESTORE-ONLY by
      # design — the pipeline owns writing the cache; the hourly only reads it
      # warm, dropping up to ~23 six-month daily downloads per run.
      - name: OHLCV cache day key
        id: ohlcvcache
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ohlcv-${{ runner.os }}-${{ steps.ohlcvcache.outputs.day }}
          restore-keys: |
            ohlcv-${{ runner.os }}-

      - name: Record alert-runner start
        id: starttime
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run hourly alert
        env:
          CB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          CB_DISPATCH_KIND: ${{ github.event.inputs.kind }}
          CB_DISPATCH_SLOT: ${{ github.event.inputs.slot }}
        run: |
          # PRD-319 R2/R4: routine dispatch -> explicit slot; other dispatch ->
          # forced (today's behavior); 06:xx heartbeats -> mapped explicit
          # slot; hourly heartbeats -> inference.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$CB_DISPATCH_KIND" = "routine" ] && [ -n "$CB_DISPATCH_SLOT" ]; then
              python -m cuttingboard.alert_runner --routine-slot "$CB_DISPATCH_SLOT"
            else
              python -m cuttingboard.alert_runner --force-slot
            fi
          else
            case "$CB_EVENT_SCHEDULE" in
              "40 13 * * 1-5"|"40 14 * * 1-5")
                python -m cuttingboard.alert_runner --routine-slot "06:30" ;;
              "55 13 * * 1-5"|"55 14 * * 1-5")
                python -m cuttingboard.alert_runner --routine-slot "06:45" ;;
              *)
                python -m cuttingboard.alert_runner ;;
            esac
          fi

      - name: Detect fresh hourly artifacts
        id: freshcheck
        if: ${{ success() }}
        run: |
          set -euo pipefail
          PAYLOAD=logs/latest_hourly_payload.json
          START_TS=${{ steps.starttime.outputs.ts }}
          if [ ! -f "$PAYLOAD" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "alert_runner produced no hourly payload; skipping publish"
            exit 0
          fi
          payload_mtime=$(stat -c %Y "$PAYLOAD")
          if [ "$payload_mtime" -lt "$START_TS" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "alert_runner suppressed slot (payload mtime=$payload_mtime < start=$START_TS); skipping publish"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "fresh hourly payload detected (mtime=$payload_mtime >= start=$START_TS)"
          fi

      # PRD-194 (Codex P1): aggregate BEFORE render so the dashboard scoreboard
      # reflects THIS run. regime_history.jsonl is rebuilt from the restored+appended
      # audit.jsonl, and PRESERVES already-published spy_close_change_pct values it
      # cannot recompute this run (PRD-204, reading the restored prior); the renderer
      # then reads the current file instead of main's frozen copy. Resolves the parked
      # PRD-189 render-before-aggregate ordering nit, which decoupling promoted from
      # cosmetic to a correctness bug.
      - name: Aggregate regime history
        if: ${{ success() && steps.freshcheck.outputs.fresh == 'true' }}
        run: python3 -m cuttingboard.delivery.regime_history

      - name: Render and stage hourly artifacts
        if: ${{ success() && steps.freshcheck.outputs.fresh == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp logs/latest_hourly_contract.json ui/contract.json
          python3 -m cuttingboard.delivery.dashboard_renderer \
            --payload logs/latest_hourly_payload.json \
            --run logs/latest_hourly_run.json \
            --market-map-path logs/latest_hourly_market_map.json \
            --output ui/dashboard.html
          cp ui/dashboard.html ui/index.html
          # PRD-194: the render consumed pipeline-OWNED inputs restored read-only
          # (latest_run.json = LIVE STATE; macro_drivers_snapshot.json = macro
          # fallback). Revert them to HEAD so this hourly run never republishes a file
          # the pipeline owns and can't clobber a newer pipeline copy. Both are tracked
          # on main, so the checkout cleanly un-stages the restored copy; the render
          # has already read it.
          git checkout HEAD -- logs/latest_run.json logs/macro_drivers_snapshot.json

      - name: Check hourly readiness
        if: ${{ success() && steps.freshcheck.outputs.fresh == 'true' }}
        run: python3 scripts/check_readiness.py

      - name: Commit hourly artifacts
        if: ${{ success() && steps.freshcheck.outputs.fresh == 'true' }}
        run: |
          set -euo pipefail
          PRE_SHA=$(git rev-parse HEAD)
          if [ -f logs/last_hourly_slot.json ]; then
            git add -f logs/last_hourly_slot.json
          fi
          # PRD-323 R8 (A1-P): conditionally stage the run-local intraday sidecar
          # when present; a missing artifact is a no-op (it is gitignored/untracked
          # and absent from the restore list, so it never revives across runs).
          if [ -f logs/intraday_bars_snapshot.json ]; then
            git add -f logs/intraday_bars_snapshot.json
          fi
          # PRD-194 per-file ownership: hourly stages only what it OWNS/regenerates.
          # The pipeline-owned snapshots (market_map.json, latest_run.json,
          # latest_contract.json, latest_payload.json, macro_drivers_snapshot.json) are
          # NOT staged here — the pipeline is their sole publisher. trend_structure is
          # co-produced (hourly writes it too), so it stays.
          git add -f \
            logs/audit.jsonl \
            logs/regime_history.jsonl \
            logs/latest_hourly_market_map.json \
            logs/trend_structure_snapshot.json \
            logs/price_bars_snapshot.json \
            logs/latest_hourly_run.json \
            logs/latest_hourly_contract.json \
            logs/latest_hourly_payload.json
          git add ui/contract.json ui/dashboard.html ui/index.html
          git diff --staged --quiet || git commit -m "CB hourly: $(date -u +%Y-%m-%dT%H:%MZ)"
          POST_SHA=$(git rev-parse HEAD)
          if [ "$PRE_SHA" = "$POST_SHA" ]; then
            echo "artifact commit: no changes"
          else
            echo "artifact commit: committed changes ($PRE_SHA -> $POST_SHA)"
          fi
          echo "PRE_SHA=$PRE_SHA" >> "$GITHUB_ENV"
          echo "POST_SHA=$POST_SHA" >> "$GITHUB_ENV"

      # PRD-194 (Codex P1): ref guard — a non-main workflow_dispatch runs the alert
      # but does NOT publish to the unprotected branch. Residual (workflow-edit
      # attacker) is closed only by out-of-tree governance; see DECISIONS.
      - name: Push hourly artifacts
        if: ${{ success() && steps.freshcheck.outputs.fresh == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          bash tools/ci_push_artifacts.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hourly-alert-failure-${{ github.run_number }}
          path: |
            traceback.txt
            logs/latest_contract.json
            logs/latest_hourly_run.json
            logs/latest_hourly_contract.json
            logs/latest_hourly_payload.json
          if-no-files-found: ignore
          retention-days: 7
