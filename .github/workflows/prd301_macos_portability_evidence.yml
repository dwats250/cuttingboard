# TEMPORARY evidence-only workflow (PRD-301, owner event #6, Option B).
# Proves the amended dev_bootstrap lock primitives (`link` exact-path + `ls -A`) on macOS.
# Hermetic: permissions {}, no secrets, no checkout, no third-party Actions, no writes.
# Removed in a separate commit once evidence is recorded. Correctness = return codes + fs state.
name: PRD-301 macOS portability evidence

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  link_ls_evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Runner details
        run: |
          set -eu
          echo "## runner"
          uname -smr
          sw_vers || true
          echo "arch: $(arch 2>/dev/null || uname -m)"
          echo "link: $(command -v link || echo MISSING)"
          echo "ls:   $(command -v ls)"
      - name: link exact-path + ls -A checks (fail the job on any violated assumption)
        run: |
          set -eu
          fail() { echo "PORTABILITY-FAIL: $1" >&2; exit 1; }
          command -v link >/dev/null 2>&1 || fail "link utility absent"
          T="$(mktemp -d)"; cd "$T"

          # 1) link src dir  MUST fail and create NO child inside the directory
          printf 'p\n' > src
          mkdir d
          if link src d 2>/dev/null; then fail "link src dir succeeded (must fail EEXIST)"; fi
          [ -z "$(ls -A d)" ] || fail "link src dir created a child inside the directory"

          # 2) link src newfile  MUST succeed and be the same inode (hardlink)
          link src newfile || fail "link src newfile failed (must succeed)"
          [ -e newfile ] || fail "newfile missing after link"
          [ src -ef newfile ] || fail "newfile is not the same inode as src"

          # 3) link src existing  MUST fail EEXIST
          : > existing
          if link src existing 2>/dev/null; then fail "link onto existing succeeded (must fail EEXIST)"; fi

          # 4) ls -A behavior on empty / one-pid / stray dirs
          mkdir empty
          [ -z "$(ls -A empty)" ] || fail "ls -A empty is non-empty"
          mkdir onlypid; : > onlypid/pid
          [ "$(ls -A onlypid)" = pid ] || fail "ls -A onlypid != 'pid' (clean-dir snapshot broken)"
          mkdir stray; : > stray/pid; : > stray/child
          [ "$(ls -A stray)" = pid ] && fail "ls -A stray equals 'pid' (stray child not detected)"
          # positive confirmation both entries are present
          ls -A stray | grep -qx pid   || fail "ls -A stray missing pid"
          ls -A stray | grep -qx child || fail "ls -A stray missing child"

          echo "PORTABILITY-OK: all link exact-path and ls -A assumptions hold on ${{ matrix.os }}"
