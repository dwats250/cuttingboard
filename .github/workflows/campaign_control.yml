# PRD-302 Slice A: dispatch-only, owner-only, non-authoritative Codex proposal
# bootstrap. Structural installation only -- behavioral + credential-isolation
# proof is the mandatory FIRST post-merge `main` dispatch (PRD-302 R7/R18).
# The structural tests in tests/test_campaign_control.py are TRIPWIRES, not
# behavioral proof. Slice A: no issue trigger, no write scope, and no
# repository-authoritative / issue / PR / comment publication (the job log and a
# one-day artifact remain observable -- that is not a publication path).
name: Campaign Control Plane (Slice A bootstrap)

# Slice A: workflow_dispatch ONLY. No issue_comment / pull_request /
# pull_request_target / repository_dispatch / workflow_run / push / schedule.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Trusted main head SHA to bind into the fixed synthetic event."
        required: true
        type: string

concurrency:
  group: campaign-control-slice-a
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  codex:
    # Sole-writer actor + reviewed-main binding (PRD-302 R2/R3; owner ruling 5).
    if: >-
      github.actor == 'dwats250' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODEX_USER: codexsandbox
      HEAD_SHA: ${{ inputs.head_sha }}
    outputs:
      charge_json: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout reviewed main (minimal, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/campaign_control.py
            .github/campaign/charge_prompt.md
            .github/campaign/charge.schema.json
          sparse-checkout-cone-mode: false

      - name: Provision unprivileged codex user and grant minimal traversal
        run: |
          set -euo pipefail
          id "$CODEX_USER" >/dev/null 2>&1 || sudo useradd -m "$CODEX_USER"
          mkdir -p .campaign-input .campaign-output
          # Public inputs readable to the distinct uid (files + campaign dir);
          # minimization/navigation, NOT a confidentiality boundary.
          sudo chmod -R a+rX tools/campaign_control.py .github/campaign
          # Public/synthetic output+input dirs writable by the codex uid.
          sudo chmod a+rwx .campaign-input .campaign-output
          # EXECUTE/TRAVERSAL ONLY (never read/list, never recursive) on the
          # runner-owned ancestors so the codex uid can OPEN the public tool. On
          # hosted runners /home/runner is 0750 (drwxr-x---, runner:runner),
          # non-traversable by a fresh useradd user -- the exact gap that failed
          # run 31759823563 closed here (Errno 13 opening the tool). o+x grants
          # traversal to a KNOWN path, never read/list of runner state.
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          sudo chmod o+x "$GITHUB_WORKSPACE/tools" "$GITHUB_WORKSPACE/.github" \
            "$GITHUB_WORKSPACE/.github/campaign"

      - name: Build fixed synthetic event
        run: |
          set -euo pipefail
          python3 tools/campaign_control.py make-dry-run-event \
            --head-sha "$HEAD_SHA" \
            --event-output .campaign-input/event.json
          sudo chmod a+r .campaign-input/event.json

      # R7 preflight, run AS the distinct codex uid, BEFORE the secret-bearing
      # action: prove (positive) the public inputs are readable and the output
      # dir writable, (identity) runner uid != codex uid, and (negative) the
      # enumerated runner credentials remain unreadable. Fail closed; print no
      # file contents or secrets. Live closure is proven at the post-merge run.
      - name: Codex-uid access + credential-isolation preflight (blocking, R7)
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          CODEX_UID="$(id -u "$CODEX_USER")"
          if [ "$RUNNER_UID" = "$CODEX_UID" ]; then
            echo "campaign-control: FAIL [preflight-uid] runner uid == codex uid" >&2
            exit 2
          fi
          # positive: every allowlisted public input is readable as the codex uid
          for f in tools/campaign_control.py .github/campaign/charge_prompt.md \
                   .github/campaign/charge.schema.json .campaign-input/event.json; do
            if ! sudo -u "$CODEX_USER" test -r "$f"; then
              echo "campaign-control: FAIL [preflight-read] public input unreadable by codex uid" >&2
              exit 2
            fi
          done
          # positive: the output directory is writable as the codex uid
          if ! sudo -u "$CODEX_USER" test -w .campaign-output; then
            echo "campaign-control: FAIL [preflight-write] output dir not writable by codex uid" >&2
            exit 2
          fi
          # negative: enumerated runner credentials remain unreadable. Derive the
          # runner root from the LIVE Runner.Worker executable (<root>/bin/
          # Runner.Worker); require exactly one; pass root+temp across the uid
          # transition. The tool probe fails closed on same-uid/absent/ambiguous/
          # mis-owned/readable and never prints contents.
          mapfile -t WORKER_PIDS < <(pgrep -x Runner.Worker || true)
          if [ "${#WORKER_PIDS[@]}" -ne 1 ]; then
            echo "campaign-control: FAIL [probe-root] Runner.Worker not uniquely resolved" >&2
            exit 2
          fi
          WORKER_EXE="$(readlink -f "/proc/${WORKER_PIDS[0]}/exe")"
          RUNNER_ROOT="$(dirname "$(dirname "$WORKER_EXE")")"
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "campaign-control: FAIL [probe-temp] RUNNER_TEMP source not set" >&2
            exit 2
          fi
          sudo -u "$CODEX_USER" python3 tools/campaign_control.py probe-isolation \
            --runner-uid "$RUNNER_UID" \
            --runner-root "$RUNNER_ROOT" \
            --runner-temp "$RUNNER_TEMP"

      # Codex Action: the LITERAL FINAL secret-bearing step of this job. Nothing
      # runs after the key reaches the proxy. unprivileged-user isolates the
      # distinct codex uid from runner-owned credentials (R6; proxy holds the key,
      # R.3). The API secret appears exactly once, here, as an action input only.
      - name: Codex synthesis (read-only, unprivileged-user, action-final)
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56  # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/campaign/charge_prompt.md
          output-schema-file: .github/campaign/charge.schema.json
          model: gpt-5.6-sol
          effort: xhigh
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codexsandbox
          codex-version: "0.147.0"
          allow-users: dwats250
          codex-args: '["--ephemeral", "--ignore-user-config"]'

  validate:
    needs: codex
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Checkout reviewed main (minimal, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/campaign_control.py
          sparse-checkout-cone-mode: false

      # Inert transport (R10): model output enters ONLY via env into pinned
      # github-script and is written to a file without source interpolation. It
      # is never spliced into a run: body, filename, artifact name, or command.
      - name: Materialize model output inertly
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CHARGE_JSON: ${{ needs.codex.outputs.charge_json }}
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('.campaign-input', { recursive: true });
            fs.mkdirSync('.campaign-output', { recursive: true });
            fs.writeFileSync('.campaign-output/charge.json', process.env.CHARGE_JSON ?? '');

      - name: Validate and render the proposed charge
        run: |
          set -euo pipefail
          python3 tools/campaign_control.py make-dry-run-event \
            --head-sha "$HEAD_SHA" \
            --event-output .campaign-input/event.json
          python3 tools/campaign_control.py validate-charge \
            --event .campaign-input/event.json \
            --charge .campaign-output/charge.json \
            --comment-output .campaign-output/proposed_charge.md

      # Observable one-day artifact; NOT a repository-authoritative/issue/PR/
      # comment publication path.
      - name: Upload rendered proposal (one-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proposed-charge
          path: .campaign-output/proposed_charge.md
          retention-days: 1
          if-no-files-found: error
