# PRD-302 Slice A: dispatch-only, owner-only, non-authoritative Codex proposal
# bootstrap. Structural installation only -- behavioral + credential-isolation
# proof is the mandatory FIRST post-merge `main` dispatch (PRD-302 R7/R18).
# The structural tests in tests/test_campaign_control.py are TRIPWIRES, not
# behavioral proof. Slice A: no issue trigger, no write scope, and no
# repository-authoritative / issue / PR / comment publication (the job log and a
# one-day artifact remain observable -- that is not a publication path).
#
# Amendment 2 (isolated public workspace; full rationale in PRD-302.md): the
# distinct codex uid runs entirely inside a uniquely-named PUBLIC /tmp workspace
# (1777), OUTSIDE /home/runner and NOT $RUNNER_TEMP -- no o+x grant on any
# runner-owned ancestor (that approach exposed a world-readable credential in run
# 31763968329). R7 is a SPLIT proof: a runner-uid leg + an exact-codex-uid leg.
name: Campaign Control Plane (Slice A bootstrap)

# Slice A: workflow_dispatch ONLY. No issue_comment / pull_request /
# pull_request_target / repository_dispatch / workflow_run / push / schedule.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Trusted main head SHA to bind into the fixed synthetic event."
        required: true
        type: string

concurrency:
  group: campaign-control-slice-a
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  codex:
    # Sole-writer actor + reviewed-main binding (PRD-302 R2/R3; owner ruling 5).
    if: >-
      github.actor == 'dwats250' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODEX_USER: codexsandbox
      HEAD_SHA: ${{ inputs.head_sha }}
    outputs:
      charge_json: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout reviewed main (minimal, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/campaign_control.py
            .github/campaign/charge_prompt.md
            .github/campaign/charge.schema.json
          sparse-checkout-cone-mode: false

      - name: Provision unprivileged codex user and isolated public workspace
        run: |
          set -euo pipefail
          id "$CODEX_USER" >/dev/null 2>&1 || sudo useradd -m "$CODEX_USER"
          # Isolated PUBLIC Codex workspace under /tmp -- OUTSIDE /home/runner and
          # NOT $RUNNER_TEMP. The path is fixed and derived ONLY from the trusted
          # run id (never model/event text). /tmp is world-traversable (1777), so
          # the codex uid reaches this workspace WITHOUT any o+x grant on a
          # runner-owned ancestor -- the ancestor-traversal approach is removed.
          WS="/tmp/campaign-ws-${GITHUB_RUN_ID}"
          rm -rf "$WS"
          mkdir -p "$WS/tools" "$WS/.github/campaign" \
            "$WS/.campaign-input" "$WS/.campaign-output"
          # Copy ONLY the approved public inputs (tool, prompt, schema) into the
          # isolated workspace; the synthetic event is built into it next.
          cp tools/campaign_control.py "$WS/tools/campaign_control.py"
          cp .github/campaign/charge_prompt.md "$WS/.github/campaign/charge_prompt.md"
          cp .github/campaign/charge.schema.json "$WS/.github/campaign/charge.schema.json"
          # PUBLIC copies readable to the codex uid (minimization under /tmp, never
          # a grant on a runner-owned path). INPUT dir is read-only to the codex
          # uid (runner owns it, writes the event); ONLY output is writable (F5).
          chmod -R a+rX "$WS/tools" "$WS/.github"
          chmod a+rX "$WS/.campaign-input"
          chmod a+rwx "$WS/.campaign-output"

      - name: Build fixed synthetic event (isolated workspace)
        run: |
          set -euo pipefail
          WS="/tmp/campaign-ws-${GITHUB_RUN_ID}"
          python3 tools/campaign_control.py make-dry-run-event \
            --head-sha "$HEAD_SHA" \
            --event-output "$WS/.campaign-input/event.json"
          chmod a+r "$WS/.campaign-input/event.json"

      # R7 SPLIT isolation proof, BEFORE the secret-bearing action. Runner-side
      # leg (runner uid): resolve the runner root from the LIVE Runner.Worker,
      # require RUNNER_TEMP, and prove the canonical .credentials EXISTS and is
      # runner-owned (absence/ambiguity/mis-ownership fail closed); it emits the
      # bound credential PATHS only (never contents). Codex-side leg (exact codex
      # uid, via the COPY of the tool in the isolated workspace so it never
      # traverses /home/runner): prove /home/runner NON-traversable, every
      # enumerated credential UNREADABLE, and only the isolated public inputs
      # readable / its output writable. Fail closed; print no contents or secrets.
      - name: Split runner/codex credential-isolation proof (blocking, R7)
        run: |
          set -euo pipefail
          WS="/tmp/campaign-ws-${GITHUB_RUN_ID}"
          RUNNER_UID="$(id -u)"
          # --- runner-side leg (runner uid): derive root, prove canonical -------
          # Capture pgrep's exit code explicitly; NO `|| true`/process-sub that
          # would slip a one-PID-then-nonzero failure past set -e (Sol F4).
          set +e; WORKER_PIDS_RAW="$(pgrep -x Runner.Worker)"; PGREP_RC=$?; set -e
          if [ "$PGREP_RC" -ne 0 ] || [ -z "$WORKER_PIDS_RAW" ]; then
            echo "campaign-control: FAIL [probe-root] Runner.Worker not resolved" >&2
            exit 2
          fi
          mapfile -t WORKER_PIDS <<< "$WORKER_PIDS_RAW"
          if [ "${#WORKER_PIDS[@]}" -ne 1 ]; then
            echo "campaign-control: FAIL [probe-root] Runner.Worker not uniquely resolved" >&2
            exit 2
          fi
          WORKER_EXE="$(readlink -f "/proc/${WORKER_PIDS[0]}/exe")"
          RUNNER_ROOT="$(dirname "$(dirname "$WORKER_EXE")")"
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "campaign-control: FAIL [probe-temp] RUNNER_TEMP source not set" >&2
            exit 2
          fi
          # Plain assignment so a runner-side FAIL propagates under set -e (a
          # process-substitution pipe would swallow the exit code).
          CRED_PATHS_RAW="$(python3 tools/campaign_control.py probe-runner-side \
            --runner-uid "$RUNNER_UID" \
            --runner-root "$RUNNER_ROOT" \
            --runner-temp "$RUNNER_TEMP")"
          # Empty capture must not become a one-element [""] that false-greens the
          # codex-side len>=1 check (Sol F1); fail closed before mapfile.
          [ -n "$CRED_PATHS_RAW" ] || { echo "campaign-control: FAIL [probe-no-creds] runner-side emitted no credential paths" >&2; exit 2; }
          mapfile -t CRED_PATHS <<< "$CRED_PATHS_RAW"
          # --- codex-side leg (exact codex uid): prove isolation ---------------
          CRED_ARGS=()
          for p in "${CRED_PATHS[@]}"; do CRED_ARGS+=(--credential "$p"); done
          sudo -u "$CODEX_USER" python3 "$WS/tools/campaign_control.py" probe-codex-isolation \
            --runner-uid "$RUNNER_UID" \
            "${CRED_ARGS[@]}" \
            --input "$WS/tools/campaign_control.py" \
            --input "$WS/.github/campaign/charge_prompt.md" \
            --input "$WS/.github/campaign/charge.schema.json" \
            --input "$WS/.campaign-input/event.json" \
            --input-dir "$WS/.campaign-input" \
            --output-dir "$WS/.campaign-output"

      # Codex Action: the LITERAL FINAL secret-bearing step of this job. Nothing
      # runs after the key reaches the proxy. unprivileged-user isolates the
      # distinct codex uid inside the isolated /tmp workspace (working-directory);
      # the proxy holds the key (R6/R.3). The API secret appears exactly once,
      # here, as an action input only. working-directory/prompt-file/
      # output-schema-file are absolute, fixed, derived only from the trusted run
      # id -- never model/event text.
      - name: Codex synthesis (read-only, unprivileged-user, action-final)
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56  # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: /tmp/campaign-ws-${{ github.run_id }}
          prompt-file: /tmp/campaign-ws-${{ github.run_id }}/.github/campaign/charge_prompt.md
          output-schema-file: /tmp/campaign-ws-${{ github.run_id }}/.github/campaign/charge.schema.json
          model: gpt-5.6-sol
          effort: xhigh
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: codexsandbox
          codex-version: "0.147.0"
          allow-users: dwats250
          # Amendment 3: --ephemeral only. Do NOT re-add --ignore-user-config: it made Codex ignore the action's CODEX_HOME proxy config -> provider=openai -> 401 (PRD-302).
          codex-args: '["--ephemeral"]'

  validate:
    needs: codex
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Checkout reviewed main (minimal, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/campaign_control.py
          sparse-checkout-cone-mode: false

      # Inert transport (R10): model output enters ONLY via env into pinned
      # github-script and is written to a file without source interpolation. It
      # is never spliced into a run: body, filename, artifact name, or command.
      - name: Materialize model output inertly
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CHARGE_JSON: ${{ needs.codex.outputs.charge_json }}
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('.campaign-input', { recursive: true });
            fs.mkdirSync('.campaign-output', { recursive: true });
            fs.writeFileSync('.campaign-output/charge.json', process.env.CHARGE_JSON ?? '');

      - name: Validate and render the proposed charge
        run: |
          set -euo pipefail
          python3 tools/campaign_control.py make-dry-run-event \
            --head-sha "$HEAD_SHA" \
            --event-output .campaign-input/event.json
          python3 tools/campaign_control.py validate-charge \
            --event .campaign-input/event.json \
            --charge .campaign-output/charge.json \
            --comment-output .campaign-output/proposed_charge.md

      # Observable one-day artifact; NOT a repository-authoritative/issue/PR/
      # comment publication path.
      - name: Upload rendered proposal (one-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proposed-charge
          path: .campaign-output/proposed_charge.md
          retention-days: 1
          if-no-files-found: error
