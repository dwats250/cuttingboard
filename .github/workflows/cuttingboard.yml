name: Cuttingboard Pipeline

# PRD-299: stamp the GitHub-native slot carrier into display_title. Every
# automatic OPEN/PRE run carries exactly one CB-SLOT:<slot> token; a legacy/
# operator dispatch without a slot, Sunday, and any non-slot run get the default
# name (which MUST NOT contain the substring "CB-SLOT:"). The event_name guard
# keeps inputs.slot from being read on a schedule event.
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.slot != '') && format('CB-SLOT:{0}', inputs.slot)
   || github.event.schedule == '20 13 * * 1-5' && 'CB-SLOT:OPEN'
   || github.event.schedule == '20 14 * * 1-5' && 'CB-SLOT:OPEN'
   || github.event.schedule == '50 12 * * 1-5' && 'CB-SLOT:PRE'
   || format('Cuttingboard Pipeline {0}', github.run_number) }}

on:
  schedule:
    # Prefetch warm-up: 05:50 PT / 12:50 UTC, Monday–Friday (PRE slot)
    - cron: '50 12 * * 1-5'
    # PRD-319: OPEN/live delayed fallbacks, DUAL-SEASONAL (replaces the single
    # 5 13). 20 13 = 06:20 PT in PDT season; 20 14 = 06:20 PT in PST season —
    # ~20 min after the preferred Cloudflare 06:00 PT OPEN dispatch, year-round
    # (owner ruling 2026-08-28 Q2: winter 06:00 primacy). Both fire every
    # weekday; scripts/check_open_fallback_window.py no-ops the OFF-SEASON twin
    # (season-keyed, so a LATE in-season delivery still executes). Each cron is
    # still fixed UTC; the pair + gate is what makes the PT wall clock hold.
    - cron: '20 13 * * 1-5'
    - cron: '20 14 * * 1-5'
    # Sunday regime-only report: 23:30 UTC (7:30 PM ET, 30 min after futures open)
    - cron: '30 23 * * 0'
    # PRD-189: the ORB (50 13) and intraday (*/30 14-21) crons were removed.
    # Those slots ran the full live pipeline via cli_main, which is NOT their
    # intended notify path (_execute_notify_run); the intraday window is already
    # covered by hourly_alert.yml. Correctly homing orb_trajectory / post_orb /
    # midmorning / power_hour is deferred to a follow-up PRD (see PROJECT_STATE).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'live'
        type: choice
        options:
          - live
          - sunday
          - verify
          - prefetch
      # PRD-299: logical slot (Cloudflare Worker sets this). OPEN<->live,
      # PRE<->prefetch (validated fail-closed in resolve_run_mode.py). Empty =
      # legacy/operator dispatch with no slot. type: string (not choice) so the
      # optional-empty case is unambiguous.
      slot:
        description: 'Logical slot: OPEN, PRE, or empty (legacy)'
        required: false
        default: ''
        type: string
      # PRD-299: descriptive provenance ONLY — never read by any coordination
      # predicate or authority check; a spoofed source grants nothing.
      source:
        description: 'Dispatch provenance (provenance only, not authentication)'
        required: false
        default: ''
        type: string

# Never cancel a mid-run pipeline — queue instead.
# PRD-299: coordination-participating OPEN runs (CF workflow_dispatch slot=OPEN,
# and the 20 13 / 20 14 delayed fallback crons) use a FIXED DEDICATED group with native
# non-evicting queuing (queue: max), so a later OPEN-class enqueue (a third valid
# OPEN, a malformed slot=OPEN dispatch, or a duplicate CF dispatch) can NEVER
# cancel/replace a pending OPEN fallback (Sol finding C5). All other slots keep
# the cuttingboard-pipeline group. queue: max is a strict superset of the prior
# "queue, don't cancel" intent (the old single-pending default silently DROPPED a
# pending run) and never combines with cancel-in-progress: true.
# PRD-194: cross-workflow publish races to the `publish` branch are handled by
# ci_push_artifacts.sh's delta-append + bounded push-retry, NOT a shared lock.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && inputs.slot == 'OPEN') || github.event.schedule == '20 13 * * 1-5' || github.event.schedule == '20 14 * * 1-5')
     && 'cb-open-coordination' || 'cuttingboard-pipeline' }}
  queue: max

permissions:
  contents: write
  actions: read

jobs:
  pipeline:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      # PRD-295: credentials for the terminal fail-loud notification step only.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # PRD-304: relay the operator-availability repository variable into the
      # runtime. Absence resolves CANNOT_MONITOR (fail-closed); Dustin sets it to
      # AVAILABLE to permit new trades. This is a pass-through only — no new job,
      # secret, or push target.
      CB_OPERATOR_AVAILABILITY: ${{ vars.CB_OPERATOR_AVAILABILITY }}
      # PRD-194: artifacts publish to this unprotected branch, not main.
      PUBLISH_BRANCH: publish
      # Static-analysis default so the VS Code GitHub Actions extension can
      # resolve env.PUBLISH_READY in the commit/push `if:` gates below. At
      # runtime each per-mode step exports PUBLISH_READY through the GITHUB_ENV
      # file; a step's GITHUB_ENV write takes precedence over a job-level env
      # default for all subsequent steps, so the runtime value still wins.
      # Safe fallback: 'false' matches today's behavior when no run step sets it.
      PUBLISH_READY: 'false'

    steps:
      # PRD-194: pin to main. workflow_dispatch can be triggered from any branch;
      # publishing now targets the UNPROTECTED `publish` branch, so an unpinned
      # checkout would let a dispatch on a feature branch publish that branch's
      # rendered ui/logs to production. Scheduled runs already run on main.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # PRD-189: resolve the slot in scripts/resolve_run_mode.py (stdlib-only,
      # unit-tested). It keys on github.event.schedule (the cron string), not
      # wall-clock minutes, so a queue-delayed run still resolves to its slot
      # (the old exact-minute match resolved every late run to noop). Scope is
      # the dedicated premarket crons (prefetch/live/sunday); intraday/orb are
      # deferred to a follow-up PRD (see PROJECT_STATE).
      - name: Determine run mode
        id: mode
        env:
          CB_EVENT_NAME: ${{ github.event_name }}
          CB_DISPATCH_MODE: ${{ github.event.inputs.mode }}
          CB_SCHEDULE: ${{ github.event.schedule }}
          CB_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -eo pipefail
          # PRD-299 R2: resolve_run_mode.py also validates slot<->mode for a
          # workflow_dispatch (OPEN<->live, PRE<->prefetch) and exits non-zero on
          # a mismatch. `set -e` + command substitution fails the step closed here,
          # BEFORE the OPEN first-success pre-check below, so a malformed OPEN
          # dispatch can never become a satisfying no-op.
          job_mode="$(python3 scripts/resolve_run_mode.py)"
          echo "job_mode=$job_mode" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $job_mode"

      # PRD-319 R5: season gate for the dual-seasonal OPEN fallback crons.
      # Runs ONLY for the two schedule-event fallback crons (never for a
      # workflow_dispatch OPEN, Sunday, or prefetch). Season-keyed — a LATE
      # in-season delivery still executes; the off-season twin always no-ops.
      # The script fails closed (non-zero) on an unknown cron, failing the job
      # visibly rather than guessing.
      - name: OPEN fallback season gate
        id: seasongate
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '20 13 * * 1-5' || github.event.schedule == '20 14 * * 1-5')
        env:
          CB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -eo pipefail
          verdict="$(python3 scripts/check_open_fallback_window.py)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Season gate: $verdict"

      - name: OPEN fallback off-season (coordinated no-op)
        if: steps.seasongate.outputs.verdict == 'OFF_SEASON_NOOP'
        run: |
          echo "Off-season fallback twin — the other seasonal cron owns 06:20 PT today."
          echo "This run concludes as a coordinated no-op success; no publish."

      # PRD-299 R6: automatic-OPEN first-success pre-check. Runs only for an
      # automatic OPEN invocation (the 20 13 / 20 14 fallback crons OR a workflow_dispatch
      # slot=OPEN). Uses the ambient github.token (existing actions: read; no new
      # credential). FAIL TOWARD AVAILABILITY: never fail the job here — the
      # emitted `state` output is the signal. state==SATISFIED => a prior
      # qualifying OPEN already published today => skip live (coordinated no-op
      # success). UNSATISFIED / PROOF_ERROR / empty (crash) => execute. Only stdlib
      # + the cuttingboard package (time_utils) is needed, so this runs before the
      # dev-dependency install.
      - name: OPEN first-success pre-check
        id: openslot
        if: >-
          steps.mode.outputs.job_mode == 'live' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP' &&
          (github.event.schedule == '20 13 * * 1-5' || github.event.schedule == '20 14 * * 1-5' || github.event.inputs.slot == 'OPEN')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_open_slot_satisfied.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Unexpected non-zero (the script normally exits 0 and emits state);
            # fail toward availability -> execute.
            echo "check_open_slot_satisfied exited $rc unexpectedly; executing (fail toward availability)"
            echo "state=PROOF_ERROR" >> "$GITHUB_OUTPUT"
          fi

      - name: OPEN slot already satisfied (coordinated no-op)
        if: >-
          steps.mode.outputs.job_mode == 'live' &&
          steps.openslot.outputs.state == 'SATISFIED'
        run: |
          echo "OPEN slot already satisfied by a prior successful qualifying run "
          echo "(${{ steps.openslot.outputs.state }}) — skipping live execution."
          echo "This run concludes as a coordinated no-op success; no publish."

      # PRD-193: persist the OHLCV warm-up cache (data/cache) across the ephemeral
      # runners so the 12:50 prefetch run warms it and the 13:00 live run reads it
      # warm instead of re-fetching ~12 months of daily bars per symbol. Keyed on
      # the UTC trading day; restore-keys prefix-falls back to the most recent
      # prior-day cache (safe -- the trading-day freshness check re-validates and
      # re-fetches anything that is not the most recent completed session). Only
      # the cache-warming modes touch the key.
      - name: OHLCV cache day key
        id: ohlcvcache
        if: >-
          (steps.mode.outputs.job_mode == 'prefetch' ||
          steps.mode.outputs.job_mode == 'live' ||
          steps.mode.outputs.job_mode == 'sunday') &&
          steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore OHLCV cache
        if: >-
          (steps.mode.outputs.job_mode == 'prefetch' ||
          steps.mode.outputs.job_mode == 'live' ||
          steps.mode.outputs.job_mode == 'sunday') &&
          steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ohlcv-${{ runner.os }}-${{ steps.ohlcvcache.outputs.day }}
          restore-keys: |
            ohlcv-${{ runner.os }}-

      # PRD-194 R3: restore the accumulated/read-back state the pipeline carries on
      # the publish branch (main's copies are frozen post-decoupling):
      #   - logs/audit.jsonl: the accumulating scoreboard source (delta-appended).
      #   - logs/evaluation.jsonl: the append-only post-trade evaluation log
      #     (run_post_trade_evaluation, force-published via `git add -f logs/`).
      #     Single-writer + serialized, so restore + overwrite is enough (no delta).
      #   - logs/last_notification_state.json: _run_pipeline's notification dedup key
      #     (load_last_state -> should_send). Without it the next scheduled run
      #     re-sends an unchanged LOW/MEDIUM Telegram alert (Codex P2).
      #   - logs/market_map.json: the prior-run lifecycle baseline _run_pipeline reads
      #     via _load_previous_market_map() -> inject_lifecycle(). Pipeline OWNS and
      #     republishes it; without restore, lifecycle badges/removed_symbols are
      #     computed against main's frozen snapshot -> bogus NEW/REMOVED (Codex P2).
      #   - 'logs/run_*.json': the accumulating per-run archive (immutable per file)
      #     the renderer globs for "Changes Since Last Run" + history. Frozen on main
      #     => deltas computed against a pre-decoupling run (Codex P2). Quoted so the
      #     glob reaches the restore helper, not the workflow shell. Pipeline-owned.
      #   - logs/latest_hourly_contract.json: HOURLY-owned, but the renderer's
      #     _load_contract_entry_context reads it for the dashboard's contract entry
      #     prices on the PIPELINE render too. READ-ONLY — reverted to HEAD after the
      #     render so the pipeline never republishes the hourly's mutable contract
      #     (closure-sweep finding, same class as hourly's latest_run read-only).
      #   - logs/regime_history.jsonl: the published scoreboard (PRD-204). RESTORED so
      #     the Commit step's Aggregate can PRESERVE an already-published
      #     spy_close_change_pct it cannot recompute this run (SPY parquet absent)
      #     instead of wiping it to null. Aggregate still rebuilds rows from audit;
      #     restore only supplies the prior values it would otherwise lose. Without it
      #     preserve-prior reads main's frozen 3-row fallback and the wipe still happens.
      # The restore step also records CB_PUBLISH_BASE_SHA for the audit delta-append.
      # Only the publishing modes need it.
      - name: Restore publish state
        if: >-
          (steps.mode.outputs.job_mode == 'live' ||
          steps.mode.outputs.job_mode == 'sunday' ||
          steps.mode.outputs.job_mode == 'verify') &&
          steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: bash tools/ci_restore_publish_state.sh logs/audit.jsonl logs/evaluation.jsonl logs/last_notification_state.json logs/market_map.json logs/latest_hourly_contract.json logs/regime_history.jsonl 'logs/run_*.json'

      - name: Install dev dependencies
        # PRD-299 (Sol connector P2): skip on an OPEN coordinated no-op so no
        # fallible tail step can fail the run and fire the failure notifier.
        if: steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          pip install -e ".[dev]"

      # PRD-297: exact-SHA authoritative CI proof (replaces the removed
      # full-suite/ruff runtime gate; quality control stays at the ci.yml merge
      # gate). CI_SUCCESS authorizes an observation ATTEMPT only; any other
      # typed state fails named and loud before execution.
      - name: Exact-SHA CI proof
        if: (steps.mode.outputs.job_mode == 'live' || steps.mode.outputs.job_mode == 'sunday') && steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          echo "CB_STAGE=ci_proof" >> "$GITHUB_ENV"
          python3 scripts/check_run_revision.py | tee "$RUNNER_TEMP/ci_proof.out"
          echo "CB_PROVEN_SHA=$(sed -n 's/^CI_PROOF_SHA=//p' "$RUNNER_TEMP/ci_proof.out")" >> "$GITHUB_ENV"

      # PRD-297: narrow deterministic runtime readiness (startup import chain,
      # parquet backend, entrypoint arg contract, writable dirs). Seconds-fast,
      # no network / market semantics / pytest / ruff / repair.
      - name: Runtime readiness
        if: (steps.mode.outputs.job_mode == 'live' || steps.mode.outputs.job_mode == 'sunday') && steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          echo "CB_STAGE=runtime_readiness" >> "$GITHUB_ENV"
          python3 scripts/check_runtime_readiness.py

      - name: Engine health check
        if: steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          echo "CB_STAGE=engine_doctor" >> "$GITHUB_ENV"
          python3 tools/engine_doctor.py --json --baseline tools/baseline.json > engine_doctor.json || true
          python3 tools/engine_doctor.py --baseline tools/baseline.json > engine_doctor.txt 2>&1 || true

      # PRD-295 (Codex P2): mark the upload stage so an artifact-upload failure reports
      # upload_engine_doctor, not the preceding engine_doctor. if: success() so it never
      # overwrites an earlier failing stage before this always() upload runs.
      # Pure echo (cannot fail) -> NOT state-gated, preserving the PRD-295
      # invariant that markers before always()/uses: steps stay `if: success()`.
      # The fallible Upload step below IS state-gated; a no-op that sets this
      # marker but skips the upload concludes success (no failure() -> no notify).
      - name: Stage marker (upload engine doctor)
        if: success()
        run: echo "CB_STAGE=upload_engine_doctor" >> "$GITHUB_ENV"

      - name: Upload engine doctor artifacts
        if: always() && steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        uses: actions/upload-artifact@v7
        with:
          name: engine-doctor-${{ github.run_id }}
          path: |
            engine_doctor.json
            engine_doctor.txt

      # --- Prefetch warm-up (PRD-193: cache-warm only, publish-safe) ---
      # The 50 12 prefetch cron resolves to `prefetch` (resolve_run_mode.py). This
      # step warms the OHLCV cache (data/cache) and nothing else: it sets NO
      # PUBLISH_READY, so Commit-artifacts/Push are skipped and it cannot trip the
      # PRD-119 freshness gate (execute_prefetch writes no fresh payload/run and
      # sends no notification). "Save OHLCV cache" below persists the warmed cache
      # so the 13:00 live run reads it warm.
      - name: Run prefetch
        if: steps.mode.outputs.job_mode == 'prefetch'
        run: |
          set -eo pipefail
          echo "CB_STAGE=execute" >> "$GITHUB_ENV"
          echo "=== START prefetch ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          timeout 8m python -m cuttingboard --mode prefetch --notify-mode premarket
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== END prefetch ==="

      # PRD-193 (Codex P2-1): execute_prefetch returns 0 even when a market-stress
      # halt skips compute_all_derived (so no OHLCV is warmed). Gating the save on
      # job_mode alone would persist a cold/prior-day cache under the immutable day
      # key and defeat the live reuse (PRD-198 #2: assert the RESOLVED effect, not
      # the requested action). Prove the cache actually holds a fresh bar -- with
      # the same _is_fresh_ohlcv_cache the engine uses -- before saving. Failure to
      # prove freshness resolves to `false` (do not poison the key), which is an
      # honest non-result, not a silent success (PRD-198 #1).
      - name: Check OHLCV cache warmed
        id: warmed
        if: steps.mode.outputs.job_mode == 'prefetch'
        run: |
          set -eo pipefail
          echo "CB_STAGE=prefetch_cache_check" >> "$GITHUB_ENV"
          warmed=$(python3 -c "import glob,pandas as pd;from cuttingboard.ingestion import _is_fresh_ohlcv_cache as F;print('true' if any(F(pd.read_parquet(f)) for f in glob.glob('data/cache/*_ohlcv.parquet')) else 'false')" 2>/dev/null || echo false)
          echo "ohlcv_warmed=$warmed" >> "$GITHUB_OUTPUT"
          echo "OHLCV cache warmed (fresh bar present): $warmed"

      # PRD-193: persist the just-warmed OHLCV cache under the trading-day key so
      # the 13:00 live run (a fresh runner) restores it. Only the prefetch run
      # saves -- the producer -- and only when it actually warmed a fresh cache,
      # so the immutable day key is never owned by a cold/halted run.
      # PRD-295 (Codex P2): mark the save stage so a cache-save failure reports
      # prefetch_cache_save, not the preceding execute stage.
      - name: Stage marker (save OHLCV cache)
        if: steps.mode.outputs.job_mode == 'prefetch' && steps.warmed.outputs.ohlcv_warmed == 'true'
        run: echo "CB_STAGE=prefetch_cache_save" >> "$GITHUB_ENV"

      - name: Save OHLCV cache
        if: steps.mode.outputs.job_mode == 'prefetch' && steps.warmed.outputs.ohlcv_warmed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ohlcv-${{ runner.os }}-${{ steps.ohlcvcache.outputs.day }}

      # PRD-297: REVISION_DRIFT guard -- re-read HEAD immediately before execute
      # and fail named rather than execute an unproven revision. Defense-in-depth
      # (the single checkout makes in-workspace drift near-impossible); the guard
      # is total and red-tested.
      - name: Revision drift guard
        if: (steps.mode.outputs.job_mode == 'live' || steps.mode.outputs.job_mode == 'sunday') && steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          echo "CB_STAGE=revision_drift" >> "$GITHUB_ENV"
          CUR="$(git rev-parse HEAD)"
          if [ "$CUR" != "$CB_PROVEN_SHA" ]; then
            echo "REVISION_DRIFT: current HEAD $CUR != CI-proven SHA $CB_PROVEN_SHA" >&2
            exit 1
          fi
          echo "revision drift guard: HEAD $CUR matches CI-proven SHA $CB_PROVEN_SHA"

      # --- Premarket full pipeline ---
      - name: Run live pipeline
        if: steps.mode.outputs.job_mode == 'live' && steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          echo "CB_STAGE=execute" >> "$GITHUB_ENV"
          echo "=== START live ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          # PRD-296: capture the CLI exit code (set +e + PIPESTATUS) so the
          # FAIL-owned sentinel grep runs even on failure, then preserve the
          # original exit semantics (PUBLISH_READY still gated on rc==0).
          set +e
          timeout 8m python -m cuttingboard --mode live --notify-mode premarket 2>&1 | tee "$RUNNER_TEMP/cb_run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '::CB_NOTIFY_OWNED_FAIL::' "$RUNNER_TEMP/cb_run.log"; then echo "CB_NOTIFIED=true" >> "$GITHUB_ENV"; fi
          # PRD-300: relay the delivery-failed sentinel (a VALID market-stress HALT whose owed
          # notification failed at transport) so the backstop step below can resend the owed alert.
          if grep -q '::CB_NOTIFY_DELIVERY_FAILED::' "$RUNNER_TEMP/cb_run.log"; then echo "CB_DELIVERY_FAILED=true" >> "$GITHUB_ENV"; fi
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== END live ==="
          if [ "$rc" -eq 0 ]; then echo "PUBLISH_READY=true" >> "$GITHUB_ENV"; fi
          exit "$rc"

      # --- Sunday regime-only report ---
      - name: Run Sunday regime report
        if: steps.mode.outputs.job_mode == 'sunday'
        run: |
          set -eo pipefail
          echo "CB_STAGE=execute" >> "$GITHUB_ENV"
          echo "=== START sunday ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          # PRD-296: capture the CLI exit code (set +e + PIPESTATUS) so the
          # FAIL-owned sentinel grep runs even on failure, then preserve the
          # original exit semantics (PUBLISH_READY still gated on rc==0).
          set +e
          timeout 8m python -m cuttingboard --mode sunday --notify-mode premarket 2>&1 | tee "$RUNNER_TEMP/cb_run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '::CB_NOTIFY_OWNED_FAIL::' "$RUNNER_TEMP/cb_run.log"; then echo "CB_NOTIFIED=true" >> "$GITHUB_ENV"; fi
          # PRD-300: relay the delivery-failed sentinel, mirroring the OWNED_FAIL relay and the
          # live step. DEFENSIVE/SYMMETRY on Sunday: MODE_SUNDAY forces STAY_FLAT and never
          # system-halts, so a market-stress HALT (and thus this sentinel) cannot arise here
          # today; kept identical to the live relay for parity and future-routing robustness.
          if grep -q '::CB_NOTIFY_DELIVERY_FAILED::' "$RUNNER_TEMP/cb_run.log"; then echo "CB_DELIVERY_FAILED=true" >> "$GITHUB_ENV"; fi
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== END sunday ==="
          if [ "$rc" -eq 0 ]; then echo "PUBLISH_READY=true" >> "$GITHUB_ENV"; fi
          exit "$rc"

      # PRD-300: notification-delivery backstop. A VALID market-stress HALT concludes
      # executor-SUCCESS (exit 0, PRD-298), so the failure() terminal notifier below is
      # unreachable; if its single owed Telegram send returned FAILED_TRANSPORT, the runtime
      # emitted ::CB_NOTIFY_DELIVERY_FAILED:: (relayed to CB_DELIVERY_FAILED above). Resend the
      # IDENTICAL owed notification (reconstructed from the canonical contract via the existing
      # formatter + dispatch) on the same channel/audience/credentials. Placed before Verify so
      # an unrelated later step failure cannot skip the owed alert. Fail-open: this step never
      # fails the job (a valid market-stress HALT is an execution SUCCESS).
      - name: Backstop owed HALT notification (delivery retry)
        if: env.CB_DELIVERY_FAILED == 'true'
        run: |
          set +e
          echo "CB_STAGE=delivery_backstop" >> "$GITHUB_ENV"
          python -c "from cuttingboard.runtime import resend_owed_market_stress_halt_notification as r; r()"
          exit 0

      # --- Verify: runs after live or sunday, or standalone via workflow_dispatch ---
      - name: Verify run
        if: >-
          (steps.mode.outputs.job_mode == 'live' ||
          steps.mode.outputs.job_mode == 'sunday' ||
          steps.mode.outputs.job_mode == 'verify') &&
          steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          echo "CB_STAGE=verify" >> "$GITHUB_ENV"
          echo "=== START verify ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          timeout 8m python -m cuttingboard --mode verify --notify-mode premarket
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== END verify ==="
          # PRD-194 (Codex P2): verify mode VALIDATES only — it does NOT regenerate the
          # latest_run/payload/contract snapshots, so it must NOT publish (it would push a
          # dashboard rendered from main's frozen snapshots). PUBLISH_READY stays 'false'
          # for a verify-only dispatch; live/sunday set it true in their own Run steps
          # above (publish is still gated on this verify step succeeding via `if: success()`).

      # PRD-189: orb_trajectory / post_orb / midmorning / power_hour dispatch
      # steps were removed — they invoked the full live pipeline via cli_main
      # (not their intended _execute_notify_run path) and the intraday window is
      # already covered by hourly_alert.yml. Re-homing them is a follow-up PRD.

      # --- Generate commit message from latest_run.json (live and sunday only) ---
      # PRD-295 (Codex P2): mark the commit-message stage so a failure of the always()
      # Generate step reports commit_message. if: success() (+ same modes) so it never
      # overwrites an earlier failing stage (execute/verify) that this always() step runs after.
      # Pure echo (cannot fail) -> NOT state-gated (PRD-295 marker invariant). The
      # fallible Generate-commit-message step below IS state-gated.
      - name: Stage marker (generate commit message)
        if: success() && (steps.mode.outputs.job_mode == 'live' || steps.mode.outputs.job_mode == 'sunday')
        run: echo "CB_STAGE=commit_message" >> "$GITHUB_ENV"

      - name: Generate commit message
        if: >-
          always() &&
          (steps.mode.outputs.job_mode == 'live' || steps.mode.outputs.job_mode == 'sunday') &&
          steps.openslot.outputs.state != 'SATISFIED' &&
          steps.seasongate.outputs.verdict != 'OFF_SEASON_NOOP'
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          p = Path("logs/latest_run.json")
          if not p.exists():
              Path(".cb_commit_msg").write_text("CB run: failed — no summary\n")
              sys.exit(1)

          s = json.loads(p.read_text())
          date_str  = s.get("timestamp", "")[:10]
          regime    = s.get("regime", "UNKNOWN")
          qualified = s.get("candidates_qualified", 0)
          status    = s.get("status", "UNKNOWN")
          chain     = s.get("chain_validation", {})
          symbols   = sorted(
              k for k, v in chain.items()
              if isinstance(v, dict) and v.get("classification") == "TOP_TRADE_VALIDATED"
          )
          msg = f"CB report: {date_str} | {regime} | {qualified} trades [{', '.join(symbols)}] | {status}"
          Path(".cb_commit_msg").write_text(msg + "\n")
          print(msg)
          PY

      # --- Commit artifacts (live and sunday write reports/logs) ---
      - name: Commit artifacts
        if: ${{ success() && env.PUBLISH_READY == 'true' }}
        run: |
          set -euo pipefail
          echo "CB_STAGE=render_commit" >> "$GITHUB_ENV"
          PRE_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PRD-189: refresh the scoreboard from this run's just-written audit
          # row BEFORE staging logs/ and rendering, so SCOREBOARD age reflects the
          # scheduled run immediately (not only on a later hourly publish). Same
          # read-only aggregator hourly_alert.yml uses; writes only
          # logs/regime_history.jsonl, no runtime/notify coupling (PRD-175 R5).
          python3 -m cuttingboard.delivery.regime_history
          git add reports/ || true
          git add -f logs/ || true
          cp logs/latest_contract.json ui/contract.json 2>/dev/null || true
          git add ui/contract.json || true
          python3 -m cuttingboard.delivery.dashboard_renderer --output ui/dashboard.html
          cp ui/dashboard.html ui/index.html
          git add ui/dashboard.html ui/index.html
          # PRD-194 (closure sweep): the render consumed HOURLY-owned
          # latest_hourly_contract.json (entry prices) restored read-only. Revert it to
          # HEAD so the pipeline never republishes the hourly's mutable contract (the
          # hourly owns + publishes it); tracked on main, so checkout cleanly unstages.
          git checkout HEAD -- logs/latest_hourly_contract.json
          # PRD-297: validate the FRESHLY-RENDERED current morning artifacts
          # (logs/latest_run.json run-health + ui/dashboard.html/index.html
          # markers) BEFORE commit. A non-zero validation aborts the step
          # (set -euo pipefail) before any commit or push.
          echo "CB_STAGE=artifact_validate" >> "$GITHUB_ENV"
          python3 scripts/check_readiness.py --profile morning
          if [ -f .cb_commit_msg ]; then
            git diff --staged --quiet || git commit -F .cb_commit_msg
          else
            git diff --staged --quiet || git commit -m "CB ${{ steps.mode.outputs.job_mode }}: $(date -u +%Y-%m-%d)"
          fi
          POST_SHA=$(git rev-parse HEAD)
          if [ "$PRE_SHA" = "$POST_SHA" ]; then
            echo "artifact commit: no changes"
          else
            echo "artifact commit: committed changes ($PRE_SHA -> $POST_SHA)"
          fi
          echo "PRE_SHA=$PRE_SHA" >> "$GITHUB_ENV"
          echo "POST_SHA=$POST_SHA" >> "$GITHUB_ENV"

      # PRD-194 (Codex P1): the ref guard blocks a non-main workflow_dispatch from
      # PUBLISHING to the unprotected branch (a branch dispatch can still run the
      # pipeline for testing — it just won't push). Residual: an attacker who edits
      # this workflow on their branch can drop the guard; that is closed only by
      # out-of-tree governance (branch protection / CODEOWNERS on .github/workflows).
      - name: Push
        if: ${{ success() && env.PUBLISH_READY == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          echo "CB_STAGE=push" >> "$GITHUB_ENV"
          bash tools/ci_push_artifacts.sh

      # PRD-295: fail-loud. On ANY job failure, send ONE Telegram alert built from
      # current workflow context only (mode + CB_STAGE + current time, via the existing
      # format_failure_notification + send_telegram), never from logs/latest_run.json.
      # Coverage begins after "Install dev dependencies" succeeds (post-install steps set
      # CB_STAGE). If the normal notification stack cannot be imported: a pre-install
      # failure (CB_STAGE empty) is a no-op (Option A); a post-install import failure
      # (CB_STAGE set) still sends a minimal stdlib fallback so the fail-loud path is
      # never silenced. Job cancellation / the 20-min hard timeout do not trigger
      # if: failure().
      - name: Notify on failure
        # PRD-296: suppress the generic alert only when the runtime already owns and
        # sent the FAIL notification for this attempt (CB_NOTIFIED set by the live/
        # sunday execute step on the FAIL-owned sentinel). All other failures still fire.
        if: failure() && env.CB_NOTIFIED != 'true'
        env:
          CB_JOB_MODE: ${{ steps.mode.outputs.job_mode }}
          CB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import os
          mode = os.environ.get("CB_JOB_MODE") or "unknown"
          stage = os.environ.get("CB_STAGE") or ""
          run_url = os.environ.get("CB_RUN_URL", "")
          reason = f"morning pipeline failed at stage: {stage or 'unknown'} (mode {mode}). {run_url}".strip()
          try:
              from cuttingboard.notifications import format_failure_notification
              from cuttingboard.output import send_telegram
          except Exception:
              # Importing the normal notification/output stack failed. Distinguish:
              #  - pre-install failure (no post-install step ran): CB_STAGE is empty ->
              #    Option-A, outside Slice-1 coverage, no alert and no stdlib fallback.
              #  - post-install failure where the stack import itself broke (a syntax or
              #    import error transitively reached by these modules -- exactly what a
              #    failing Lint/Test surfaces): CB_STAGE is set -> send a MINIMAL stdlib
              #    alert so the fail-loud path is not silenced. Not a second broad
              #    notification implementation; current workflow truth only.
              if not stage:
                  print("pre-install failure (no CB_STAGE carrier); no alert sent (PRD-295 option A)")
                  raise SystemExit(0)
              import urllib.parse, urllib.request
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
              text = (f"cuttingboard: morning pipeline FAILED at stage {stage} (mode {mode}); "
                      f"notification stack unavailable, minimal fallback alert. {run_url}").strip()
              if token and chat_id:
                  payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
                  req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload)
                  try:
                      urllib.request.urlopen(req, timeout=15)
                      print(f"failure alert sent (stdlib fallback): stage={stage} mode={mode}")
                  except Exception as send_exc:
                      print(f"stdlib fallback failed to send: {type(send_exc).__name__}")
              else:
                  print("stdlib fallback: Telegram credentials absent; no alert sent")
              raise SystemExit(0)
          title, body = format_failure_notification(mode, "", reason)
          send_telegram(title, body)
          print(f"failure alert sent: mode={mode} stage={stage or 'unknown'}")
          PY
